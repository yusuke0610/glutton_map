version: 2
updates:
  # SHA ピン留めした GitHub Actions を追従更新する（ピンの陳腐化対策）。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # backend の Go モジュール。
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: backend

  # web(フロント)の npm 依存。bun 管理だが Dependabot は package.json を読める。
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: web

  # tools/municipalities（市区町村データ生成スクリプト）の npm 依存。
  - package-ecosystem: npm
    directory: /tools/municipalities
    schedule:
      interval: weekly
    commit-message:
      prefix: tools
